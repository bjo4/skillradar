<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>skillradar</title>
<style>
:root{--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#dbe3ef;--brand:#0891b2;--green:#047857;--rose:#be123c;--amber:#b45309}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top left,#dff7ff,transparent 35%),var(--bg);color:var(--text)}header{position:sticky;top:0;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}nav,main{max-width:1180px;margin:auto;padding:18px}nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:850}.hero{padding:58px 18px 30px}.pill,.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:#fff;font-size:12px;margin:3px}.risk-low{color:var(--green);border-color:#bbf7d0;background:#f0fdf4}.risk-medium{color:var(--amber);border-color:#fde68a;background:#fffbeb}.risk-high{color:var(--rose);border-color:#fecdd3;background:#fff1f2}h1{font-size:clamp(36px,7vw,72px);line-height:.95;margin:14px 0}p{color:var(--muted);line-height:1.7}.panel,.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.controls{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;margin:8px 0 4px}input,select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#f1f5f9;border-radius:14px;padding:10px;margin:14px 0}.stats b{display:block;color:var(--text)}code{display:block;background:#020617;color:#cffafe;border-radius:12px;padding:10px;overflow:auto}a{color:var(--brand);text-decoration:none;font-weight:700}.muted{color:var(--muted)}@media(max-width:760px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><nav><div class="brand">skillradar</div><a href="https://github.com/bjo4/skillradar">GitHub handoff</a></nav></header>
<main>
<section class="hero"><span class="pill">SKILL.md ecosystem only · No MCP servers · No toolkits</span><h1>Agent Skills Directory with GitHub signals and anti-slop scoring.</h1><p>skillradar 幫開發者搜尋 Cursor / Claude Code / Codex 可用的 Agent Skills，重點是 repo quality signals 與 anti-slop scoring。</p></section>
<section class="panel"><div class="controls"><input id="q" placeholder="Search skill, repo, category..." /><select id="stars"><option value="0">All stars</option><option value="50">50+ stars</option><option value="500">500+ stars</option><option value="1000">1k+ stars</option><option value="5000">5k+ stars</option></select><select id="sort"><option value="quality">Quality score</option><option value="stars">GitHub stars</option><option value="recent">Recently updated</option></select><label class="pill"><input id="hide" type="checkbox" checked /> Hide likely slop</label></div><p id="count" class="muted"></p></section>
<section id="cards" class="grid"></section>
</main>
<script>
const skills=[
{name:'PDF Analyst',description:'Extracts structured summaries, citations, and tables from PDF-heavy research workflows.',categories:['documents','research'],repo:'anthropics/skills',stars:18700,forks:1500,pushedAt:'2026-09-12',license:'Apache-2.0',score:100,risk:'low',install:'npx skills add anthropics/skills'},
{name:'Next.js App Router',description:'Helps agents build route groups, metadata, loading states, and server components.',categories:['frontend','nextjs'],repo:'vercel-labs/agent-skills',stars:9400,forks:640,pushedAt:'2026-09-16',license:'MIT',score:100,risk:'low',install:'npx skills add vercel-labs/agent-skills'},
{name:'AI SDK Chat UI',description:'Guides chat interface work with streaming states, tool calls, and error recovery.',categories:['ai','frontend'],repo:'vercel-labs/agent-skills',stars:9400,forks:640,pushedAt:'2026-09-16',license:'MIT',score:100,risk:'low',install:'npx skills add vercel-labs/agent-skills'},
{name:'TDD Loop',description:'Keeps agents on a red-green-refactor loop for focused feature work.',categories:['code','quality'],repo:'cursor-public/agent-skill-recipes',stars:1280,forks:120,pushedAt:'2026-08-28',license:'MIT',score:100,risk:'low',install:'npx skills add cursor-public/agent-skill-recipes'},
{name:'Notebook Refactor',description:'Converts exploratory notebooks into clearer reusable analysis steps.',categories:['data','python'],repo:'open-agent-skills/data-workbench-skills',stars:312,forks:44,pushedAt:'2026-07-30',license:'Apache-2.0',score:97,risk:'low',install:'npx skills add open-agent-skills/data-workbench-skills'},
{name:'Threat Model Starter',description:'Builds a lightweight threat model from feature scope and data flows.',categories:['security','architecture'],repo:'agent-skills-lab/security-review-skills',stars:86,forks:11,pushedAt:'2026-06-19',license:'MIT',score:90,risk:'low',install:'npx skills add agent-skills-lab/security-review-skills'},
{name:'SEO AI Agent Skill Pack',description:'seo-ai-agent-skill-pack',categories:['marketing','quality-risk'],repo:'skill-fixtures/bulk-ai-skill-dump',stars:0,forks:0,pushedAt:'2026-09-18',license:'Unknown',score:0,risk:'high',install:'npx skills add skill-fixtures/bulk-ai-skill-dump'}
];
const $=id=>document.getElementById(id);const compact=n=>Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);function days(d){const x=Math.max(0,Math.round((Date.now()-new Date(d))/(864e5)));return x?`${x} days ago`:'today'}function render(){const q=$('q').value.toLowerCase().trim(),min=+$('stars').value,hide=$('hide').checked,sort=$('sort').value;let rows=skills.filter(s=>!q||[s.name,s.description,s.repo,s.categories.join(' ')].join(' ').toLowerCase().includes(q)).filter(s=>s.stars>=min).filter(s=>!hide||s.risk!=='high');rows.sort((a,b)=>sort==='stars'?b.stars-a.stars:sort==='recent'?new Date(b.pushedAt)-new Date(a.pushedAt):b.score-a.score);$('count').textContent=`顯示 ${rows.length} / ${skills.length} skills`;$('cards').innerHTML=rows.map(s=>`<article class="card"><span class="pill risk-${s.risk}">${s.risk.toUpperCase()} slop risk</span><h2>${s.name}</h2><p>${s.description}</p><div>${s.categories.map(c=>`<span class="tag">${c}</span>`).join('')}</div><div class="stats"><span class="muted">Stars<b>${compact(s.stars)}</b></span><span class="muted">Forks<b>${compact(s.forks)}</b></span><span class="muted">Quality<b>${s.score}</b></span></div><p><b>${s.repo}</b><br><span class="muted">Last push ${days(s.pushedAt)} · License ${s.license}</span></p><code>${s.install}</code></article>`).join('')}['q','stars','sort','hide'].forEach(id=>$(id).addEventListener('input',render));render();
</script>
</body>
</html>
